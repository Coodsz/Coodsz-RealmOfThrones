name: Check compatibility list

on:
  pull_request:

permissions:
  contents: read

jobs:
  generated-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify generated MODS.md
        run: |
          node .github/scripts/tally-taom-compat.mjs --page-only --file compat/rot-mod-compat.json --page MODS.md --list rot
          git diff --exit-code -- MODS.md
