# The Realm of Thrones mod report form for Coodsz/Coodsz-RealmOfThrones. .github/scripts/tally-taom-compat.mjs
# (--list rot) counts these into compat/rot-mod-compat.json and MODS.md.
name: Realm of Thrones mod report
description: Tell us how a mod worked with Realm of Thrones in Coop
title: "[Mod] "
labels: ["mod-compat", "rot"]
body:
  - type: markdown
    attributes:
      value: |
        Please only report what you really tested with Realm of Thrones.
        Your report shows as a player count next to this mod on the [Realm of Thrones mod list](https://github.com/Coodsz/Coodsz-RealmOfThrones/blob/main/MODS.md). The status stays what Coodsz checked.
  - type: input
    id: mod_id
    attributes:
      label: Mod id
      description: The Module Id, as shown in the Realm of Thrones Client Launcher (or the Id in the mod's SubModule.xml)
    validations:
      required: true
  - type: input
    id: mod_name
    attributes:
      label: Mod name
      description: The mod's display name, if you know it
  - type: input
    id: mod_version
    attributes:
      label: Mod version
  # The option texts have to match what .github/scripts/tally-mod-compat.mjs (normalizeResult) reads.
  - type: dropdown
    id: status
    attributes:
      label: Result
      options:
        - works
        - broken
        - client-only
    validations:
      required: true
  - type: input
    id: rot_version
    attributes:
      label: Realm of Thrones version
      placeholder: "8.1.2"
    validations:
      required: true
  - type: input
    id: coop_version
    attributes:
      label: Coop version
      placeholder: "v0.1.8"
  - type: input
    id: game_version
    attributes:
      label: Bannerlord version
      placeholder: "v1.4.8"
  - type: textarea
    id: details
    attributes:
      label: What happened?
      description: |
        The error message, when it happened (joining, a battle, a siege), and whether the mod was on for the host, the players or both.
